<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Fictício</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 360px;
      background: white;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #1f2937;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" placeholder="Digite seu usuário" />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" placeholder="Digite sua senha" />

      <button type="submit">Entrar</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      message.className = 'message';

      if (!username || !password) {
        message.textContent = 'Preencha usuário e senha.';
        message.classList.add('error');
        return;
      }

      if (username === 'usuario_valido' && password === 'SenhaSegura123') {
        message.textContent = 'Login realizado com sucesso!';
        message.classList.add('success');
      } else {
        message.textContent = 'Credenciais inválidas.';
        message.classList.add('error');
      }
    });
  </script>
</body>
</html>
